# LombokMiner Docker Compose Stack
#
# Start:  docker-compose up -d
# Stop:   docker-compose down
#
# Services:
#   miner       — LombokMiner mining + dashboard (port 8080)
#   prometheus  — metrics collection (port 9090)
#   grafana     — dashboards (port 3000, login: admin/admin)

version: "3.8"

services:
  miner:
    build: .
    container_name: lombokminer
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9100:9100"
      - "4028:4028"
    volumes:
      - ./lombokminer.toml:/etc/lombokminer/lombokminer.toml:ro
    command: ["--config", "/etc/lombokminer/lombokminer.toml", "mine"]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  prometheus_data:
  grafana_data:
